server:
  port: 8020
  forward-headers-strategy: native

spring:
  application:
    name: auth-vault
  ai:
    mcp:
      server:
        name: auth-vault
        version: 0.2.0
        type: SYNC
        protocol: STREAMABLE                 # OpenClaw: mcp.servers.vault.url = http://127.0.0.1:8020/mcp
        streamable-http.mcp-endpoint: /mcp

vault:
  base-url: ${VAULT_BASE_URL:}          # 입력 링크의 호스트
  master-key: ${VAULT_MASTER_KEY}       # base64 32바이트. openssl rand -base64 32
  data-file: ${VAULT_DATA_FILE:/data/vault.json}
  recipes-dir: ${VAULT_RECIPES_DIR:/recipes}
  token-ttl-minutes: 10
  cdp-host: ${VAULT_CDP_HOST:host.docker.internal}
  profiles:                             # OpenClaw 브라우저 프로필 → CDP 포트 (사용자별)
    yunson: 18800
    hyemi: 18801
  slack:
    bot-token: ${SLACK_BOT_TOKEN:}      # 감사 로그용 (없으면 로그만)
    channel: ${SLACK_ALERT_CHANNEL:}

logging.level.banghak.home.authvault: INFO