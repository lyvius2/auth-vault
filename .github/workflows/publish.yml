name: publish
on:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-24.04-arm          # Mac mini = arm64. 네이티브 빌드는 QEMU 로는 너무 느려 ARM 러너 사용
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { username: "${{ secrets.DOCKERHUB_USERNAME }}", password: "${{ secrets.DOCKERHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cena-vault:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/cena-vault:latest